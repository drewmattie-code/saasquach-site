version: '3.9'

services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  # Static build + preview (production mode)
  preview:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '4173:4173'
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0"
    environment:
      - NODE_ENV=production
    profiles:
      - preview
